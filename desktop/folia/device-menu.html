<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>播放设备</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { color: var(--fg, #f3f4f6); font: 12px/1.4 var(--fontFamily, "Segoe UI", sans-serif); }
    #menu { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 7px; border: 1px solid var(--border, #454954); border-radius: 12px; background: var(--panel, #202229); }
    header { flex: none; padding: 3px 8px 7px; color: var(--dim, #a3a8b5); font-size: 11px; font-weight: 600; }
    #options { min-height: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border, #454954) transparent; }
    #options::-webkit-scrollbar { width: 5px; }
    #options::-webkit-scrollbar-thumb { border-radius: 6px; background: var(--border, #454954); }
    button { display: grid; grid-template-columns: minmax(0, 1fr) 16px; align-items: center; gap: 8px; width: 100%; min-height: 52px; margin: 0; padding: 8px 9px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    button:hover, button:focus-visible { background: color-mix(in srgb, var(--accent, #ae99ef) 13%, var(--panel, #202229)); outline: none; }
    button:focus-visible { box-shadow: inset 0 0 0 1px var(--accent, #ae99ef); }
    button:disabled { opacity: .5; cursor: default; }
    .copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .label { font-size: 12px; font-weight: 600; white-space: normal; overflow-wrap: anywhere; }
    .description { color: var(--dim, #a3a8b5); font-size: 10px; white-space: normal; overflow-wrap: anywhere; }
    .check { color: var(--accent, #ae99ef); font-size: 14px; font-weight: 700; }
    footer { flex: none; margin: 5px 8px 0; padding-top: 6px; border-top: 1px solid var(--border, #454954); color: var(--dim, #a3a8b5); font-size: 10px; }
    .empty { margin: 8px; color: var(--dim, #a3a8b5); }
  </style>
</head>
<body>
  <section id="menu" aria-label="播放设备">
    <header>播放设备</header>
    <div id="options" role="listbox" aria-label="播放设备"></div>
    <footer>切换控制目标，不会自动播放</footer>
  </section>
</body>
</html>
