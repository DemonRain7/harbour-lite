<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbour · 表情包</title><link rel="stylesheet" href="./shared.css"><link rel="stylesheet" href="./sticker-manager.css"></head><body><main class="shell">
  <header class="bar"><span class="bar-mark">✦</span><div class="bar-copy"><small>Semantic Stickers</small><h1>智能表情包</h1></div><span class="spacer"></span><button class="btn primary" id="chooseSticker">＋ 添加表情包</button></header>
  <section class="panel"><div class="section"><div class="row"><div class="grow"><strong>轻量语义匹配</strong><div class="tiny">只按标签与对话文字在本机匹配，不下载 570 MB embedding 模型，也不消耗 LLM token。</div></div><span class="pill">LOCAL</span></div></div><div class="sticker-grid" id="stickerGrid"></div></section>
  <dialog id="stickerDialog"><form method="dialog" class="dialog-card"><h2>添加本地表情包</h2><img id="stickerPreview" alt="预览"><label>名称<input class="field" id="stickerLabel" maxlength="80"></label><label>适用语境 / 关键词<input class="field" id="stickerPhrases" placeholder="开心，完成，好耶，喜欢"></label><label>情绪<select id="stickerMood"><option value="happy">开心</option><option value="calm">平静</option><option value="curious">好奇</option><option value="focused">专注</option><option value="concerned">担心</option><option value="shy">害羞</option></select></label><div class="row dialog-actions"><button class="btn" value="cancel">取消</button><button class="btn primary" id="saveSticker" value="default">保存</button></div></form></dialog>
</main><script src="./appearance.js"></script><script src="./sticker-manager.js"></script></body></html>
