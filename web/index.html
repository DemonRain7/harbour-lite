<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harbour</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2312141d'/%3E%3Cpath d='M8 3.2 L11.6 8 L8 12.8 L4.4 8 Z' fill='%23818cf8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/themes.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/file-viewer.css" />
  <link rel="stylesheet" href="/cowork.css" />
  <link rel="stylesheet" href="/workflow-canvas.css" />
  <link rel="stylesheet" href="/motion.css" />
  <link rel="stylesheet" href="/chat-hero.css" />
  <link rel="stylesheet" href="/music.css" />
  <link rel="stylesheet" href="/chat-music.css" />
  <link rel="stylesheet" href="/chat-intake.css" />
  <link rel="stylesheet" href="/calendar.css" />
  <link rel="stylesheet" href="/google-integrations.css" />
  <link rel="stylesheet" href="/town-host.css" />
  <link rel="stylesheet" href="/cron.css" />
  <link rel="stylesheet" href="/shell.css" />
  <link rel="stylesheet" href="/studio.css" />
  <link rel="stylesheet" href="/collections.css" />
  <link rel="stylesheet" href="/chat-sessions.css" />
  <link rel="stylesheet" href="/trace-progress.css" />
  <link rel="stylesheet" href="/run-picker.css" />
  <link rel="stylesheet" href="/voice-picker.css" />
  <link rel="stylesheet" href="/chat-tools.css" />
  <link rel="stylesheet" href="/chat-composer.css" />
</head>
<body data-theme-cat="premium" data-theme-persona="neutral" data-theme="premium-champagne">
  <img class="harbour-hero" alt="Harbour" />

  <header class="topbar">
    <div class="topbar-identity">
      <button class="nav-toggle" id="navToggle" type="button" aria-label="展开导航" aria-controls="sidebar" aria-expanded="false" title="展开导航（也可悬停屏幕左缘）">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9 4.5v15"/></svg>
      </button>
      <div class="nav-history" role="group" aria-label="页面历史">
        <button class="nav-history-button" id="navBack" type="button" disabled aria-label="后退" title="后退（Alt+←）">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        </button>
        <button class="nav-history-button" id="navForward" type="button" disabled aria-label="前进" title="前进（Alt+→）">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
        </button>
      </div>
      <div class="brand">
        <span class="brand-name">Harbour</span>
        <svg class="brand-flourish" viewBox="0 0 132 44" aria-hidden="true" focusable="false">
          <path class="brand-tide" d="M9 36c29-5 60 8 108-2m-28 6c9 0 16-1 23-3"/>
        </svg>
      </div>
    </div>
    <div class="topbar-theme">
      <label class="theme-label">THEME</label>
      <select id="themeCat" class="theme-select" title="大类（视觉语言）"></select>
      <select id="themePersona" class="theme-select" title="角色皮肤"></select>
      <select id="themeVariant" class="theme-select" title="配色变体"></select>
    </div>
  </header>

  <div class="shell">
    <div class="nav-edge" id="navEdge" title="导航（悬停唤出）"></div>
    <nav class="sidebar" id="sidebar" aria-label="主导航">
      <div class="nav-primary" id="navPrimary"></div>
      <details class="nav-more" id="navMore">
        <summary><span class="nav-more-icon" aria-hidden="true">···</span><span>更多功能</span><svg class="nav-more-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 5 5 5-5 5"/></svg></summary>
        <div class="nav-secondary" id="navSecondary"></div>
        <button class="desktop-pet-quick" id="desktopPetQuick" type="button" hidden title="显示当前角色桌宠">桌面陪伴</button>
      </details>
    </nav>

    <main class="content" id="content">
      <!-- active panel injected by app.js -->
    </main>
  </div>

  <!-- Charts are loaded only when Dashboard is opened, not for ordinary Main Chat. -->
  <script src="/visual-activity.js"></script>
  <script src="/time-zone.js"></script>
  <script src="/agent-config.js"></script>
  <script src="/workflow-canvas.js"></script>
  <script src="/unsaved-changes.js"></script>
  <script src="/chat-tools.js"></script>
  <script src="/chat-hero.js"></script>
  <script src="/music.js"></script>
  <script src="/music-context.js"></script>
  <script src="/chat-music.js"></script>
  <script src="/chat-unread.js"></script>
  <script src="/chat-intake.js"></script>
  <script src="/chat-drop.js"></script>
  <script src="/calendar.js"></script>
  <script src="/google-integrations.js"></script>
  <script src="/town.js"></script>
  <script src="/cron.js"></script>
  <script src="/spaces.js"></script>
  <script src="/trace-progress.js"></script>
  <script src="/run-picker.js"></script>
  <script src="/voice-picker.js"></script>
  <script src="/voice-library.js"></script>
  <script src="/file-viewer.js"></script>
  <script src="/desktop-startup.js"></script>
  <script src="/markdown-copy.js"></script>
  <script src="/app.js"></script>
  <!-- 动效层 MOTION v1：纯增强，必须在 app.js 之后（按名包装其顶层函数）。 -->
  <script src="/motion.js"></script>
</body>
</html>
